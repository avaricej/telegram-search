[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-scout-desktop"
version = "0.1.0"
description = "Local desktop search and monitoring for Telegram chats"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = ["PySide6==6.10.1", "Telethon==1.42.0", "qasync==0.28.0", "keyring==25.7.0", "platformdirs==4.5.0"]

[project.optional-dependencies]
build = ["pyinstaller==6.17.0"]

[project.gui-scripts]
chat-scout = "chat_scout.app:main"

[tool.setuptools.packages.find]
where = ["src"]
